<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Héctor Tecumshé Mojica Zárate">
<meta name="description" content="Guía de campo para celular de la Ruta 2 del recorrido SOMEXA 2026: zona media, piso agroecológico de lomerío; el café y el chayote en la montaña cafetalera de Veracruz.">
<meta name="theme-color" content="#4a2e1e">
<title>Ruta 2 · Zona media · SOMEXA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<style>
/* Layout: guía de una columna con cuatro secciones (Ruta, Sitios, Cuaderno, Más) y barra inferior; cada sitio es una ficha desplegable */
:root {
  --niebla: #f4efe8;
  --hoja: #fbfcfd;
  --tinta: #261b14;
  --gris: #6b5d52;
  --linea: #e5dacd;
  --arandano: #5a3524;
  --arandano-2: #4a2e1e;
  --arandano-suave: #f1e3d6;
  --kiwi: #5d8a2a;
  --kiwi-suave: #e8f0d8;
  --oro: #a8741a;
  --oro-suave: #f5ead3;
  --rojo: #b23a2f;
  --lluvia: #2a6f9c;
  --calor: #b23a2f;
  --cielo3d: #ece4d8;
  --sombra: 0 1px 2px rgb(20 24 50 / .06), 0 8px 24px rgb(20 24 50 / .07);
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", P052, Georgia, serif;
  --suave: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --niebla: #15100c; --hoja: #1f1813; --tinta: #f1e9e1; --gris: #b9aa9c; --linea: #3a2e25; --arandano: #e3b48f; --arandano-2: #f0c9a6;
  --arandano-suave: #3a271b; --kiwi: #a9cf63; --kiwi-suave: #22301a; --oro: #e2b25a; --oro-suave: #2d2616; --rojo: #ef8b7a;
  --lluvia: #72b5e3; --calor: #f08a73; --cielo3d: #1f1813; --sombra: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark } }
:root[data-theme="dark"] {
  --niebla: #15100c; --hoja: #1f1813; --tinta: #f1e9e1; --gris: #b9aa9c; --linea: #3a2e25; --arandano: #e3b48f; --arandano-2: #f0c9a6;
  --arandano-suave: #3a271b; --kiwi: #a9cf63; --kiwi-suave: #22301a; --oro: #e2b25a; --oro-suave: #2d2616; --rojo: #ef8b7a;
  --lluvia: #72b5e3; --calor: #f08a73; --cielo3d: #1f1813; --sombra: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--niebla); color: var(--tinta); font: 17px/1.58 var(--serif); padding-inline: 16px;
  padding-block: env(safe-area-inset-top, 0px) calc(88px + env(safe-area-inset-bottom, 0px)); overflow-x: hidden }
img, svg { max-width: 100% }
[hidden] { display: none !important }
h1, h2, h3, h4 { font-family: var(--serif); margin: 0; line-height: 1.14; text-wrap: balance; font-weight: 700 }
h1 { font-size: clamp(2.1rem, 9vw, 3.1rem); letter-spacing: -.015em }
h2 { font-size: 1.5rem } h3 { font-size: 1.22rem } h4 { font-size: 1.02rem }
p { margin: 0 }
a { color: var(--arandano) }
button, input, select, textarea { font: inherit; color: inherit }
.num { font-variant-numeric: tabular-nums lining-nums }
.versalita { font-variant: small-caps; text-transform: lowercase; letter-spacing: .08em; font-weight: 700; color: var(--oro); font-size: 1.02rem }
.gris { color: var(--gris) }
main { max-width: 780px; margin: 0 auto }
.vista { display: grid; gap: 28px; padding-block: 18px 16px }
section { display: grid; gap: 12px; min-width: 0 }

/* entrada suave de las vistas y de los bloques al aparecer */
@media (prefers-reduced-motion: no-preference) {
  .vista:not([hidden]) { animation: entra .55s var(--suave) both }
  .revela { opacity: 0; transform: translateY(18px); transition: opacity .7s var(--suave), transform .7s var(--suave) }
  .revela.visto { opacity: 1; transform: none }
  .btn, .chip, .tarjeta { transition: transform .25s var(--suave), box-shadow .25s var(--suave), background-color .25s }
  .btn:active { transform: scale(.97) }
  .ruta-trazo { stroke-dasharray: 1000; stroke-dashoffset: 1000 }
  .visto .ruta-trazo { animation: traza 3.2s var(--suave) .2s forwards }
  .perfil .linea { stroke-dasharray: 3000; stroke-dashoffset: 3000 }
  .visto .perfil .linea { animation: traza3 2.6s var(--suave) .1s forwards }
  html { scroll-behavior: smooth }
}
@keyframes entra { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes traza { to { stroke-dashoffset: 0 } }
@keyframes traza3 { to { stroke-dashoffset: 0 } }
@keyframes niebla { 0% { transform: translateX(-12%) } 100% { transform: translateX(12%) } }

/* portada con niebla en movimiento */
.portada { position: relative; display: grid; gap: 16px; padding: 22px 20px 24px; margin-inline: -16px; overflow: hidden; isolation: isolate;
  background: linear-gradient(165deg, #3d2417 0%, #5a3524 45%, #4f7a2a 100%); color: #f4f5fb; border-radius: 0 0 26px 26px }
.portada::before, .portada::after { content: ""; position: absolute; inset: -20% -30%; z-index: -1; pointer-events: none;
  background: radial-gradient(40% 30% at 30% 70%, rgb(255 255 255 / .16), transparent 70%), radial-gradient(35% 25% at 75% 35%, rgb(255 255 255 / .12), transparent 70%) }
@media (prefers-reduced-motion: no-preference) { .portada::before { animation: niebla 18s ease-in-out infinite alternate } .portada::after { animation: niebla 26s ease-in-out infinite alternate-reverse } }
.portada .versalita { color: #f3d79b }
.portada p { color: #e5e7f4 }
.sellos { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center }
.aniv { justify-self: start; margin: 0; font: 700 .78rem/1.2 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #fff !important; background: #149a9a; padding: 6px 12px; border-radius: 999px; box-shadow: 0 2px 8px rgb(0 0 0 / .2) }
.organiza { margin: 0; font-size: .95rem; color: #f3e7c4 !important }
.sellos img { width: 64px; height: 64px; object-fit: contain; border-radius: 14px; background: #fff; padding: 3px; box-shadow: 0 2px 10px rgb(0 0 0 / .2) }
.sellos div { display: grid; line-height: 1.25; font-size: .92rem } .sellos b { font-size: 1rem }
.filete { height: 1px; background: linear-gradient(90deg, rgb(255 255 255 / .55), rgb(255 255 255 / 0)) }
.lema { font-style: italic; font-size: 1.02rem; color: #f3e7c4 !important; border-left: 3px solid #f3d79b; padding-left: 10px }
.credito { font-size: .95rem } .credito b { color: #fff }
.cifras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.cifra { border-top: 2px solid rgb(255 255 255 / .5); padding-top: 7px }
.cifra b { display: block; font-size: 1.35rem; color: #fff } .cifra span { font-size: .86rem; color: #d9dcef }

.aviso { background: var(--oro-suave); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; font-size: .95rem }
.aviso b { color: var(--oro) }
.ahora { background: var(--arandano); color: #fff; border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px; text-decoration: none; box-shadow: var(--sombra) }
.ahora small { font-variant: small-caps; letter-spacing: .08em; color: #d9dbf7 }

.figura { border-radius: 16px; overflow: hidden; border: 1px solid var(--linea); background: var(--hoja); box-shadow: var(--sombra) }
.desliza { overflow-x: auto; -webkit-overflow-scrolling: touch }
.mapa { display: block; width: 100%; height: auto; min-width: 640px } .mapa.vertical { min-width: 0; max-height: 82vh; width: auto; margin: 0 auto }
.parada-mapa { cursor: pointer }
.pie { font-size: .84rem; color: var(--gris) }
.mapa3d { position: relative; height: min(70vh, 520px); background: var(--cielo3d); touch-action: none }
.mapa3d canvas { display: block; width: 100%; height: 100% }
.capa-etiquetas { position: absolute; inset: 0; pointer-events: none; overflow: hidden }
.etiqueta-3d { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; gap: 6px; align-items: center; background: var(--hoja); color: var(--tinta);
  border: 1px solid var(--linea); border-radius: 999px; padding: 3px 10px 3px 3px; font: 700 .78rem var(--serif); white-space: nowrap; cursor: pointer; box-shadow: 0 1px 5px rgb(0 0 0 / .18) }
.etiqueta-3d i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: .72rem }
.etiqueta-yo i { background: #d63a2f }
.sin-3d { padding: 24px; color: var(--gris) }
.hud { position: absolute; left: 10px; right: 10px; bottom: 10px; display: grid; gap: 6px; background: color-mix(in srgb, var(--hoja) 92%, transparent);
  border: 1px solid var(--linea); border-radius: 14px; padding: 10px 12px; font-size: .9rem; backdrop-filter: blur(6px) }
.hud .barra-t { height: 6px; border-radius: 3px; background: var(--linea); overflow: hidden } .hud .barra-t i { display: block; height: 100%; width: 0; background: var(--arandano) }
.hud-fila { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline } .hud-fila b { font-size: 1.1rem }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px }
.chip { flex: none; border: 1px solid var(--linea); background: var(--hoja); border-radius: 999px; padding: 6px 13px; font-size: .9rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: center }
.chip[aria-pressed="true"] { background: var(--arandano); color: #fff; border-color: var(--arandano) }
.btn { border: 1px solid var(--linea); background: var(--hoja); border-radius: 12px; padding: 9px 14px; font-size: .94rem; cursor: pointer; display: inline-flex; gap: 6px;
  align-items: center; text-decoration: none; color: var(--tinta); box-shadow: 0 1px 2px rgb(0 0 0 / .04) }
.btn.prim { background: var(--arandano); color: #fff; border-color: var(--arandano) }
:root[data-theme="dark"] .btn.prim, .btn.prim { color: var(--hoja) }
.btn.kiwi { border-color: var(--kiwi); color: var(--kiwi) }
.btn.peligro { color: var(--rojo); border-color: var(--rojo) }
.btn:focus-visible, .chip:focus-visible, a:focus-visible, summary:focus-visible, .parada-mapa:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px }
.botones { display: flex; flex-wrap: wrap; gap: 8px }

.perfil { display: block; width: 100%; height: auto; min-width: 600px }
.perfil .rej { stroke: var(--linea) } .perfil text { fill: var(--gris); font: 14px var(--serif) }
.perfil .area { fill: var(--arandano); opacity: .14 } .perfil .linea { fill: none; stroke: var(--arandano); stroke-width: 3; stroke-linejoin: round }
.perfil .sitio circle { stroke: var(--hoja); stroke-width: 3 } .perfil .sitio text { fill: #fff; font-weight: 700; font-size: 13px }

.tabla-wrap { overflow-x: auto; border: 1px solid var(--linea); border-radius: 14px; background: var(--hoja) }
table { border-collapse: collapse; width: 100%; font-size: .9rem }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--linea); text-align: left; vertical-align: top }
table.matriz { min-width: 520px } .matriz td, .matriz th { text-align: center } .matriz td:first-child, .matriz th:first-child { text-align: left }
.punto { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--kiwi) } .vacio { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--linea) }

/* línea de tiempo de sitios */
ol.linea-tiempo { list-style: none; margin: 0; padding: 0; display: grid }
.lt { display: grid; grid-template-columns: 62px 1fr; gap: 12px; scroll-margin-top: 14px }
.lt-hora { text-align: right; padding-top: 16px; font-weight: 700; font-variant-numeric: tabular-nums }
.lt-hora small { display: block; font-weight: 400; color: var(--gris); font-size: .8rem }
.lt-cuerpo { border-left: 3px solid var(--linea); padding: 12px 0 18px 16px; position: relative; min-width: 0 }
.lt-cuerpo::before { content: ""; position: absolute; left: -9px; top: 18px; width: 15px; height: 15px; border-radius: 50%; background: var(--niebla); border: 3px solid var(--linea) }
.lt.visita .lt-cuerpo, .lt.comida .lt-cuerpo { border-left-color: var(--arandano) }
.lt.visita .lt-cuerpo::before, .lt.comida .lt-cuerpo::before { background: var(--arandano); border-color: var(--arandano) }
.lt.tramo .lt-cuerpo { border-left-style: dashed }
.lt.en-curso .lt-cuerpo::before { background: var(--oro); border-color: var(--oro); box-shadow: 0 0 0 6px color-mix(in srgb, var(--oro) 28%, transparent) }
.tarjeta { background: var(--hoja); border: 1px solid var(--linea); border-radius: 18px; padding: 16px; display: grid; gap: 14px; box-shadow: var(--sombra); min-width: 0 }
.sitio-cab { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start }
.sitio-cab .n { width: 38px; height: 38px; border-radius: 50%; background: var(--arandano); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 1.1rem }
.lugar { color: var(--gris); font-size: .92rem }
.insignias { display: flex; flex-wrap: wrap; gap: 6px; font-size: .8rem }
.vm { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin: 8px 0 }
.vm div { border: 1px solid var(--linea); border-left: 3px solid var(--kiwi); border-radius: 10px; padding: 8px 12px; background: var(--niebla); font-size: .95rem; font-style: italic }
.vm span { display: block; font-style: normal; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--kiwi); font-weight: 700 }
.insignia { border: 1px solid var(--linea); border-radius: 999px; padding: 1px 10px; background: var(--niebla) }
.insignia.alt { border-color: var(--arandano); color: var(--arandano); background: var(--arandano-suave) }
.insignia.el { border-color: var(--kiwi); color: var(--kiwi); background: var(--kiwi-suave) }
details.bloque { border-top: 1px solid var(--linea); padding-top: 10px }
details.bloque > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center }
details.bloque > summary::-webkit-details-marker { display: none }
details.bloque > summary::after { content: "+"; font-size: 1.3rem; color: var(--gris); transition: transform .3s var(--suave) }
details.bloque[open] > summary::after { transform: rotate(45deg) }
.cuerpo { display: grid; gap: 10px; padding-top: 10px; font-size: .97rem }
dl.ficha { margin: 0; display: grid; gap: 12px } dl.ficha dt { font-variant: small-caps; text-transform: lowercase; letter-spacing: .06em; color: var(--oro); font-weight: 700 } dl.ficha dd { margin: 0 }
.identidad { background: linear-gradient(135deg, var(--oro-suave), var(--hoja)); border: 1px solid color-mix(in srgb, var(--oro) 35%, transparent); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px }
.identidad ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px }
.analisis { background: var(--arandano-suave); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px }
.analisis small { font-variant: small-caps; letter-spacing: .08em; color: var(--arandano); font-weight: 700 } .analisis p { font-size: 1.05rem; font-style: italic }
ul.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px }
ul.checks label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer }
ul.checks input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--kiwi); flex: none }
ul.checks input:checked + span { color: var(--gris); text-decoration: line-through }
ul.lista { margin: 0; padding-left: 1.1em; display: grid; gap: 5px }
.lista-chips { display: flex; flex-wrap: wrap; gap: 6px } .lista-chips span { background: var(--niebla); border: 1px solid var(--linea); border-radius: 999px; padding: 2px 10px; font-size: .86rem }
.clima { display: grid; gap: 8px } .formula { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline } .formula b { font-size: 1.3rem; color: var(--arandano) }
svg.climograma { display: block; width: 100%; height: auto } .clima table { font-size: .76rem } .clima th, .clima td { padding: 3px 5px; text-align: center }

/* cuaderno */
.cuaderno { background: var(--hoja); border: 1px dashed var(--linea); border-radius: 14px; padding: 12px; display: grid; gap: 10px }
.cuaderno-cab { display: flex; justify-content: space-between; gap: 8px; align-items: baseline } .guardado { font-size: .78rem; color: var(--kiwi) }
.campo { display: grid; gap: 4px; font-size: .9rem } .campo > span { color: var(--gris) }
.campo input, .campo select, .campo textarea, textarea.hoja { border: 1px solid var(--linea); border-radius: 10px; padding: 9px 11px; background: var(--hoja); width: 100% }
textarea.hoja { min-height: 140px; resize: vertical; line-height: 1.7; background-image: repeating-linear-gradient(transparent 0 27px, color-mix(in srgb, var(--lluvia) 18%, transparent) 27px 28px); background-attachment: local }
.fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px }
.foto { display: grid; gap: 4px } .foto img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px } .foto input { font-size: .8rem; border: 1px solid var(--linea); border-radius: 8px; padding: 4px 6px; background: var(--hoja) }
.llegar { display: grid; gap: 8px; background: var(--kiwi-suave); border-radius: 14px; padding: 12px 14px }
.brujula { display: flex; gap: 12px; align-items: center } .brujula svg { width: 54px; height: 54px; flex: none } .brujula .flecha { transition: transform .6s var(--suave); transform-origin: 27px 27px }
.tramo-txt { color: var(--gris); font-size: .93rem } .tramo-txt b { color: var(--tinta) }

/* más */
.llevar { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px }
.llevar label { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; background: var(--hoja); border: 1px solid var(--linea); border-radius: 14px; padding: 12px; font-size: .92rem; cursor: pointer }
.llevar input { accent-color: var(--kiwi); width: 18px; height: 18px; margin-top: 3px } .llevar span { grid-column: 2 } .llevar b { grid-column: 2 }
.qr-caja { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center }
.qr-caja svg.qr { width: 150px; height: 150px; border-radius: 12px; border: 1px solid var(--linea); background: #fff; padding: 4px }
@media (max-width: 420px) { .qr-caja { grid-template-columns: 1fr; justify-items: center; text-align: center } .lt { grid-template-columns: 50px 1fr; gap: 8px } }

/* barra inferior */
nav.barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--hoja) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--linea); padding-bottom: env(safe-area-inset-bottom, 0px) }
nav.barra a { display: grid; justify-items: center; gap: 2px; padding: 9px 4px 10px; text-decoration: none; color: var(--gris); font-size: .8rem; position: relative }
nav.barra svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }
nav.barra a[aria-current="page"] { color: var(--arandano); font-weight: 700 }
nav.barra a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--arandano) }
#toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--tinta); color: var(--niebla);
  padding: 10px 16px; border-radius: 12px; font-size: .92rem; box-shadow: var(--sombra); max-width: calc(100vw - 32px) }
dialog { border: 1px solid var(--linea); border-radius: 16px; background: var(--hoja); color: var(--tinta); max-width: 420px; width: calc(100% - 32px) }
dialog::backdrop { background: rgb(10 12 25 / .45) }
:root { --linea-ratio: var(--linea); --acento-ratio: var(--kiwi) }
.leyenda-veg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--gris) }
.leyenda-veg span { display: inline-flex; gap: 6px; align-items: center } .leyenda-veg i { width: 14px; height: 10px; border-radius: 3px; opacity: .8 }
.cultivos { display: grid; gap: 4px } .cultivo summary h3 { font-size: 1.12rem }
ol.calendario { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; border-left: 3px solid var(--kiwi); padding-left: 12px }
ol.calendario li { display: grid; gap: 1px } ol.calendario b { color: var(--kiwi) }
.dato-cultivo { background: var(--oro-suave); border-radius: 12px; padding: 10px 12px }
.ratio-sec .doi-ratio { color: var(--gris) }

.ratio-sec { display: grid; gap: 12px }
.familia-ratio { display: grid; gap: 6px; border-top: 1px solid var(--linea-ratio, rgb(127 127 127 / .3)); padding-top: 12px }
.familia-ratio h3 { margin: 0 }
.lema-ratio { font-style: italic; opacity: .8 }
.apps-ratio { margin: 0; padding-left: 1.1em; display: grid; gap: 6px }
.doi-ratio { font-size: .78em; white-space: nowrap; opacity: .8 }

<template id="tpl-ratio"><section class="tarjeta revela visto ratio-sec" id="familia-ratio" aria-labelledby="t-ratio"><h2 id="t-ratio">Más allá del recorrido: aplicaciones para la agroecología</h2><p>Lo que hoy observas en campo —el saber campesino, la diversidad de cultivos, el agua, el suelo y los animales— también se puede documentar, medir y planear. La familia Ratio, desarrollada en la Universidad Autónoma Chapingo, reúne aplicaciones libres para el teléfono y la computadora, con instructivos para productores y para científicos y con DOI para citarlas.</p><div class="familia-ratio"><h3>Ratio Complexus</h3><p class="lema-ratio">El saber local como sistema complejo adaptativo</p><p>Una parcela, una comunidad y su territorio son sistemas complejos adaptativos: muchos agentes —familias, plantas, animales, suelos, mercados— interactúan, aprenden y se reorganizan ante sequías, plagas o cambios de precio, y de esas interacciones emerge un orden que nadie dirige. Estas aplicaciones tejen ese conocimiento en una red y lo convierten en indicadores de regeneración, riesgo y sostenibilidad, alineados con los 17 Objetivos de Desarrollo Sostenible. Así apoyan la gestión estratégica integrada de los recursos naturales: decidir qué conservar, qué restaurar y dónde intervenir primero.</p><ul class="apps-ratio"><li><a href="https://hectortecumshe-ai.github.io/RatioTelar/" target="_blank" rel="noopener"><b>Ratio Telar</b></a> — El saber agrícola local como sistema complejo adaptativo: red ponderada, cladograma, regeneración, riesgos, sostenibilidad, ODS y prospectiva, de la región a la localidad. <a class="doi-ratio" href="https://doi.org/10.5281/zenodo.23429007" target="_blank" rel="noopener">DOI 10.5281/zenodo.23429007</a></li><li><a href="https://hectortecumshe-ai.github.io/RatioMilpa/" target="_blank" rel="noopener"><b>Ratio Milpa</b></a> — El conocimiento local del maíz nativo en todo México: 64 razas, un cuestionario para cada localidad y un atlas nacional. <a class="doi-ratio" href="https://doi.org/10.5281/zenodo.23432657" target="_blank" rel="noopener">DOI 10.5281/zenodo.23432657</a></li><li><a href="https://hectortecumshe-ai.github.io/RatioVina/" target="_blank" rel="noopener"><b>Ratio Viña</b></a> — El conocimiento local de la vid: clima vitícola, historial del viñedo, regeneración y riesgo; su instructivo sigue la uva de mesa de Mata de Zarza, Veracruz. <a class="doi-ratio" href="https://doi.org/10.5281/zenodo.23481024" target="_blank" rel="noopener">DOI 10.5281/zenodo.23481024</a></li></ul></div><div class="familia-ratio"><h3>Ratio Nutritio</h3><p class="lema-ratio">Dietas para animales con lo que hay en la región</p><p>Formulan raciones de mínimo costo que cumplen los requerimientos nutricionales de cada etapa y permiten comparar ingredientes locales, costos y, en bovinos, la huella ambiental. Ponen en práctica dos elementos de la agroecología: la eficiencia y el reciclaje de los recursos del propio sistema.</p><ul class="apps-ratio"><li><a href="https://hectortecumshe-ai.github.io/RatioBos/" target="_blank" rel="noopener"><b>Ratio Bos</b></a> — Raciones para bovinos de carne con NASEM (2016), el clima de tu región, programa de engorda y huella ambiental. <a class="doi-ratio" href="https://doi.org/10.5281/zenodo.23197134" target="_blank" rel="noopener">DOI 10.5281/zenodo.23197134</a></li><li><a href="https://hectortecumshe-ai.github.io/RatioAvis/" target="_blank" rel="noopener"><b>Ratio Avis</b></a> — Dietas por fase para pollo de engorda, con ajustes por altitud y calor y certificado de optimalidad. <a class="doi-ratio" href="https://doi.org/10.5281/zenodo.23123050" target="_blank" rel="noopener">DOI 10.5281/zenodo.23123050</a></li><li><a href="https://hectortecumshe-ai.github.io/FormulAves/" target="_blank" rel="noopener"><b>FormulAves</b></a> — La primera de la familia: formular, mezclar y costear la dieta del pollo paso a paso, toda en español. <a class="doi-ratio" href="https://doi.org/10.5281/zenodo.23094626" target="_blank" rel="noopener">DOI 10.5281/zenodo.23094626</a></li></ul></div><p class="resiliencia-ratio">La resiliencia, uno de los diez elementos de la agroecología, no es resistir sin cambiar: es la capacidad de un sistema de absorber una perturbación y reorganizarse sin perder su identidad. La diversidad, las sinergias y el conocimiento compartido que verás en este recorrido son justamente lo que la sostiene, y estas herramientas ayudan a medirla y a cuidarla.</p><div class="qrs-ratio"><figure><svg class="qr-ratio" viewBox="0 0 37 37" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Código QR de https://hectortecumshe-ai.github.io/RatioTelar/" shape-rendering="crispEdges"><rect width="37" height="37" fill="#fff"/><path d="M2,2h1v1h-1zM3,2h1v1h-1zM4,2h1v1h-1zM5,2h1v1h-1zM6,2h1v1h-1zM7,2h1v1h-1zM8,2h1v1h-1zM12,2h1v1h-1zM13,2h1v1h-1zM16,2h1v1h-1zM17,2h1v1h-1zM20,2h1v1h-1zM21,2h1v1h-1zM25,2h1v1h-1zM28,2h1v1h-1zM29,2h1v1h-1zM30,2h1v1h-1zM31,2h1v1h-1zM32,2h1v1h-1zM33,2h1v1h-1zM34,2h1v1h-1zM2,3h1v1h-1zM8,3h1v1h-1zM11,3h1v1h-1zM17,3h1v1h-1zM18,3h1v1h-1zM19,3h1v1h-1zM23,3h1v1h-1zM24,3h1v1h-1zM25,3h1v1h-1zM26,3h1v1h-1zM28,3h1v1h-1zM34,3h1v1h-1zM2,4h1v1h-1zM4,4h1v1h-1zM5,4h1v1h-1zM6,4h1v1h-1zM8,4h1v1h-1zM12,4h1v1h-1zM14,4h1v1h-1zM16,4h1v1h-1zM19,4h1v1h-1zM28,4h1v1h-1zM30,4h1v1h-1zM31,4h1v1h-1zM32,4h1v1h-1zM34,4h1v1h-1zM2,5h1v1h-1zM4,5h1v1h-1zM5,5h1v1h-1zM6,5h1v1h-1zM8,5h1v1h-1zM11,5h1v1h-1zM15,5h1v1h-1zM17,5h1v1h-1zM19,5h1v1h-1zM24,5h1v1h-1zM28,5h1v1h-1zM30,5h1v1h-1zM31,5h1v1h-1zM32,5h1v1h-1zM34,5h1v1h-1zM2,6h1v1h-1zM4,6h1v1h-1zM5,6h1v1h-1zM6,6h1v1h-1zM8,6h1v1h-1zM11,6h1v1h-1zM13,6h1v1h-1zM18,6h1v1h-1zM21,6h1v1h-1zM24,6h1v1h-1zM25,6h1v1h-1zM28,6h1v1h-1zM30,6h1v1h-1zM31,6h1v1h-1zM32,6h1v1h-1zM34,6h1v1h-1zM2,7h1v1h-1zM8,7h1v1h-1zM10,7h1v1h-1zM12,7h1v1h-1zM14,7h1v1h-1zM15,7h1v1h-1zM16,7h1v1h-1zM20,7h1v1h-1zM22,7h1v1h-1zM28,7h1v1h-1zM34,7h1v1h-1zM2,8h1v1h-1zM3,8h1v1h-1zM4,8h1v1h-1zM5,8h1v1h-1zM6,8h1v1h-1zM7,8h1v1h-1zM8,8h1v1h-1zM10,8h1v1h-1zM12,8h1v1h-1zM14,8h1v1h-1zM16,8h1v1h-1 window.DATOS = {"slug":"somexa-2026-zona-media","url":"https://hectortecumshe-ai.github.io/recorridos-somexa/2026-ruta-2/","evento":"SOMEXA","congreso":"IV Congreso Mexicano de Agroecología 2026","lema":"Ciencia y saber campesino para construir soberanía alimentaria y energética","fecha":"Sábado 14 de noviembre de 2026","fecha_iso":"2026-11-14","nombre_corto":"Zona media","numero":2,"lema_ruta":"Piso agroecológico de lomerío","cita_autores":"Mojica-Zárate, H. T., Partida-Sedas, J. G., Díaz-José, Ó., Alejo-Bello, S., y Rojas-Reyes, J. O.","cultivos":[{"id":"cafe","nombre":"Café","cientifico":"Coffea arabica L.","donde":["roble","contla"],"origen":"Originario de las montañas de Etiopía. Llegó a Veracruz a finales del siglo XVIII y la región de Córdoba, Huatusco y Coatepec fue de las primeras zonas cafetaleras de México.","variedades":"Typica, Bourbon, Caturra, Garnica, Mundo Novo; y, frente a la roya, Costa Rica 95, Marsellesa y otras tolerantes. En cafés de especialidad, también Geisha.","clima":"Arábigo de altura: entre 900 y 1,600 m en Veracruz, con 1,500 a 2,500 mm de lluvia, temperaturas templadas y sombra que lo protege del sol y del frío.","calendario":[["Floración","marzo–abril, con las primeras lluvias"],["Desarrollo del fruto","mayo–octubre"],["Cosecha","noviembre–marzo: corte selectivo de cereza madura (el recorrido cae al inicio)"],["Poda y renovación","después de la cosecha"]],"manejo":"Sombra diversificada, poda, renovación de plantas viejas, abonos orgánicos con la pulpa compostada y manejo de la roya y la broca.","plagas":"Roya del cafeto (Hemileia vastatrix), que causó una epidemia en México en 2012–2013; broca (Hypothenemus hampei); ojo de gallo en zonas muy húmedas.","transformacion":"Beneficio húmedo (lavado), natural o honey → café pergamino → morteado y selección → café verde (oro) → tostado → taza. La catación califica la calidad.","mercado":"Café convencional por intermediarios o cooperativas, o café de especialidad con precio por calidad y venta directa. La región está dentro de la Denominación de Origen «Café Veracruz».","dato":"Un cafetal bajo sombra puede albergar una gran diversidad de aves: por eso se habla de café «amigable con las aves»."},{"id":"chayote","nombre":"Chayote","cientifico":"Sechium edule (Jacq.) Sw.","donde":["chayote"],"origen":"México es su centro de origen, domesticación y diversificación. Del náhuatl huitz ayotl, «calabaza espinosa». De Mesoamérica pasó a Centroamérica; en el siglo XVIII llegó a Europa y África, y a fines del XIX a Asia.","variedades":"Complejos varietales virens levis (verde liso, el comercial), nigrum spinosum, nigrum xalapensis, albus dulcis y albus minor, además de especies silvestres emparentadas.","clima":"Planta trepadora de clima templado húmedo y subhúmedo (climas C de Köppen), propia de las regiones de bosque mesófilo; necesita suelo con buen drenaje.","calendario":[["Plantación","se siembra el fruto entero, que germina dentro"],["Primera cosecha","a los pocos meses de plantar"],["Cosecha","con riego y manejo, casi todo el año, en cortes frecuentes"]],"manejo":"Emparrado (tapanco) para sostener la guía, polinización por abejas, podas de guías, fertilización y control de enfermedades del fruto en temporada húmeda.","plagas":"Enfermedades del fruto y de la guía en temporada lluviosa; insectos chupadores; pudrición de raíz en suelos encharcados.","transformacion":"Se vende fresco, sobre todo el verde liso; también se aprovechan las guías tiernas, la raíz (chinchayote) y las hojas. Se estudian sus extractos y cucurbitacinas con fines medicinales.","mercado":"Veracruz concentra buena parte de la producción y la exportación del país, sobre todo a Estados Unidos, con el tipo verde liso.","dato":"Las variedades mejoradas desplazan a las criollas: un banco de germoplasma guarda la diversidad que el mercado ya no siembra."},{"id":"platano","nombre":"Plátano","cientifico":"Musa spp.","donde":["roble","contla","empresa"],"origen":"Originario del sureste de Asia; llegó a América en el siglo XVI.","variedades":"Roatán, macho, dominico, manzano y morado; en la región también se cultiva para hoja.","clima":"Cálido y húmedo; en la montaña cafetalera crece como sombra temporal del café.","calendario":[["Producción","todo el año: cada planta da un racimo y rebrota de sus hijuelos"]],"manejo":"Como sombra temporal del cafetal y fuente de fruta y hoja; deshije, deshoje y manejo de la sigatoka.","plagas":"Sigatoka negra, picudo negro y nematodos.","transformacion":"Fruta fresca, plátano macho para cocinar y hoja para envolver tamales.","mercado":"Venta local y regional; la hoja de plátano tiene un mercado propio en la región de Fortín.","dato":"Sin la hoja de plátano no habría tamales veracruzanos de hoja: un cultivo de sombra que también es cultura."},{"id":"cana","nombre":"Caña de azúcar","cientifico":"Saccharum officinarum L.","donde":[],"origen":"Originaria de Nueva Guinea; llegó a México con los españoles, y Veracruz es hoy el principal estado cañero del país.","variedades":"Variedades mejoradas mexicanas y otras introducidas.","clima":"Cálido y subhúmedo; en la región ocupa las partes bajas y los valles, por debajo del cafetal.","calendario":[["Zafra","de noviembre a mayo, cuando la caña madura"]],"manejo":"Plantación por esquejes, fertilización, control de malezas y corte.","plagas":"Mosca pinta y barrenadores del tallo.","transformacion":"Azúcar en los ingenios y piloncillo en los trapiches tradicionales de la región.","mercado":"Ingenios azucareros; piloncillo en mercados locales.","dato":"La quema de la caña antes del corte afecta el aire y el suelo: la cosecha en verde es una alternativa."},{"id":"hierbas","nombre":"Hierbas aromáticas y medicinales","cientifico":"Epazote (Dysphania ambrosioides), estafiate (Artemisia ludoviciana), muicle (Justicia spicigera), hoja santa (Piper auritum), cúrcuma (Curcuma longa), jengibre (Zingiber officinale) y otras","donde":["empresa"],"origen":"Muchas son nativas de México y parte de su cocina y su medicina tradicional (epazote, estafiate, muicle, hoja santa); otras, como la cúrcuma y el jengibre, vienen de Asia y se adaptaron muy bien al clima cálido y húmedo de Veracruz.","variedades":"En el huerto: albahaca y albahaca clavo, cebollín xonacate, cebollino gigante, cilantro cimarrón, romero, ruda, té limón, epazote, estafiate, muicle y hoja santa.","clima":"Templado-cálido y húmedo; la cúrcuma y el jengibre necesitan calor, humedad y suelo suelto rico en materia orgánica.","calendario":[["Hojas y ramas","se cortan durante todo el año, a medida que rebrotan"],["Cúrcuma y jengibre","se siembra el rizoma con las lluvias y se cosecha unos 8 a 10 meses después"]],"manejo":"Siembra diversificada en camas, abonos orgánicos y composta, riego y cortes frecuentes; las plantas aromáticas ayudan a ahuyentar plagas en el huerto.","plagas":"Pulgones, hongos de suelo en temporada muy húmeda y pudrición de rizomas si el suelo se encharca.","transformacion":"Hierba fresca, deshidratada para infusiones, en polvo (cúrcuma), fermentada (curcumiel, kombucha de jengibre) o en conservas y aderezos.","mercado":"Venta directa al consumidor, mercados orgánicos y pedidos por redes sociales, con envases retornables.","dato":"El muicle tiñe el agua de un color rojo-morado; por eso también se le llama «sangre de Cristo»."},{"id":"gardenia","nombre":"Gardenia y flores de ornato","cientifico":"Gardenia jasminoides J. Ellis","donde":[],"origen":"La gardenia es originaria de Asia oriental; en Fortín se cultiva como agroindustria desde el siglo XIX.","variedades":"Gardenias de flor grande y aromática; en la región también orquídeas, anturios, azaleas y follajes de corte.","clima":"Templado-cálido y húmedo, con suelos ácidos, como el del valle de Fortín, a unos 1,000 m.","calendario":[["Floración","sobre todo en primavera y verano"]],"manejo":"En vivero o a cielo abierto, con suelo ácido, riego y podas.","plagas":"Cochinillas, pulgones y hongos de la raíz.","transformacion":"Flor de corte y planta en maceta; se investigan usos alternativos para la flor que no se vende.","mercado":"Mercados regionales y nacionales de flores.","dato":"La gardenia está en el escudo de Fortín: una flor que le dio su apellido a una ciudad."}],"veg_ruta":[[0.0,58.0,"BMM"],[58.0,67.5,"VAL"],[67.5,111.5,"BMM"]],"veg":{"BMM":{"nombre":"Bosque de niebla y cafetales bajo sombra","color":"#3f8f5a"},"VAL":{"nombre":"Cafetales, platanares, caña y flores del valle templado-cálido","color":"#b9a24e"},"SBC":{"nombre":"Selva mediana y cañaverales","color":"#c9874a"},"BPE":{"nombre":"Bosque de pino y encino","color":"#2f6d4a"},"OYA":{"nombre":"Bosque de oyamel","color":"#1d4a37"}},"titulo":"Ruta 2. Zona media. Piso agroecológico de lomerío","subtitulo":"De Huatusco a Ixhuatlán del Café y Fortín de las Flores, en las Altas Montañas de Veracruz: una finca cafetalera junto al bosque de niebla, el Banco Nacional de Germoplasma de Chayote, la cultura del café de Ixhuatlán y una empresa de un exalumno.","version":"1.1.0","credito":"Héctor Tecumshé Mojica Zárate, José Gervasio Partida Sedas, Óscar Díaz José, Sergio Alejo Bello y José Orlando Rojas Reyes","adscripcion":"Universidad Autónoma Chapingo · CARSH","itinerario_de":"","facilitador":"M.C. Antonio Torres Rivera","doi":"10.5281/zenodo.24014254","autores":[["Mojica-Zárate","Héctor Tecumshé","0000-0002-9067-3983"],["Partida-Sedas","José Gervasio",null],["Díaz-José","Óscar",null],["Alejo-Bello","Sergio",null],["Rojas-Reyes","José Orlando",null]],"elementos":["Diversidad","Sinergias","Eficiencia","Resiliencia","Reciclaje","Creación conjunta de conocimientos","Valores humanos y sociales","Cultura y tradiciones alimentarias","Gobernanza responsable","Economía circular y solidaria"],"paradas":[{"id":"car","tipo":"salida","nombre":"CARSH","corto":"CARSH","lugar":"Huatusco, Veracruz","lat":19.17437,"lon":-96.96141,"estancia":0,"hora_fija":"07:30","actividad":"Punto de reunión y salida puntual del autobús.","estacion":"30342","alt":1341,"km":0.0,"llegada":null,"salida":"07:30","clima":{"formula":"C(w2)b(i')","rasgos":["Templado subhúmedo, el más húmedo de los subhúmedos, con lluvias en verano","lluvia invernal entre 5 y 10.2 % del total anual","verano fresco y largo (mes más cálido entre 6.5 y 22 °C)","con poca oscilación térmica (entre 5 y 7 °C)"],"descripcion":"Templado subhúmedo, el más húmedo de los subhúmedos, con lluvias en verano. La temperatura media anual es de 17.1 °C: el mes más fresco es enero (13.5 °C) y el más cálido junio (19.6 °C). Llueven 2,005 mm al año, 83 % de ellos entre mayo y octubre; ningún mes es seco: la neblina y las lloviznas de invierno mantienen la humedad.","t":[13.5,14.5,16.3,18.3,19.5,19.6,18.7,18.9,18.8,17.5,15.6,14.3],"tmax":[19.2,20.8,22.8,25.1,25.7,25.1,24.5,24.7,23.9,22.8,20.9,20.0],"tmin":[7.8,8.3,9.9,11.6,13.3,14.1,12.9,13.1,13.7,12.2,10.3,8.6],"p":[50.5,38.1,56.3,67.8,145.5,331.2,324.2,329.4,344.8,188.1,80.2,49.3],"ta":17.1,"P":2005,"estacion":"Centro Regional Huatusco, clave 30342, Huatusco","periodo":"1991-2020","dist":3.3,"fuente_t":"medida en la misma estación"},"num":null},{"id":"roble","tipo":"visita","nombre":"Finca El Roble · Las Cañadas, bosque de niebla","corto":"Las Cañadas","lugar":"Las Cañadas, Huatusco, Veracruz (punto por confirmar)","lat":19.177,"lon":-96.9723,"estancia":120,"actividad":"Recorrido por Finca El Roble, en Las Cañadas: un centro de agroecología y permacultura dentro de uno de los últimos remanentes de bosque de niebla del centro de Veracruz.","estacion":"30342","etiquetas":["Bosque de niebla","Agroecología y permacultura","Cooperativa"],"paisaje":"Cañadas profundas cubiertas de bosque de niebla, con parcelas, huertos, cafetales y construcciones con materiales locales.","relieve":"Barrancas labradas por los arroyos que bajan de las faldas del Citlaltépetl hacia el Golfo, a unos 1,300–1,400 m.","suelo":"Andosoles de ceniza volcánica: profundos, oscuros, porosos y ricos en materia orgánica; se mantienen fértiles con composta, coberturas y la hojarasca del bosque.","sistema":"Centro de agroecología y permacultura manejado por una cooperativa: conservación del bosque de niebla, producción diversificada de alimentos para autoconsumo y venta, y educación.","ciencia":["Las Cañadas conserva alrededor de un centenar de hectáreas de bosque de niebla (las fuentes dan cifras distintas, de unas 100 a unas 300 ha), uno de los últimos remanentes de este ecosistema en el centro de Veracruz.","Lo maneja una cooperativa cuyos socios cubren buena parte de sus necesidades con su trabajo: producen maíz, frijol, tubérculos, hortalizas, frutas, huevo, leche, queso, yogur, hongos y algo de carne, además de leña, bambú y madera para construir.","Su fundador, el agrónomo Ricardo Romero, ha desarrollado sistemas de producción de alimentos a partir del cafetal, un sistema agroforestal que almacena carbono.","Imparte talleres de agroecología, permacultura, bioconstrucción y ecotecnias, y ofrece caminatas guiadas por el bosque: un ejemplo de turismo regenerativo."],"elementos":["Diversidad","Sinergias","Reciclaje","Resiliencia","Creación conjunta de conocimientos","Gobernanza responsable","Economía circular y solidaria"],"analisis":"¿Puede una comunidad vivir de producir alimentos y de conservar el bosque al mismo tiempo? ¿Qué decisiones colectivas lo hacen posible?","observar":["Cómo se distribuyen en el terreno el bosque, los huertos, los animales y las construcciones (diseño en zonas de la permacultura).","Ciclos que se cierran: estiércol, composta, residuos de cocina, agua de lluvia y aguas grises.","Diversidad de cultivos y animales, y qué se produce para comer y qué para vender.","Bioconstrucción: materiales locales (bambú, madera, tierra) y por qué se eligen.","Plantas, hongos, aves y epífitas del bosque de niebla en los senderos.","Cómo toma decisiones la cooperativa y cómo se reparten el trabajo y los beneficios."],"alternativas":["Replicar el diseño en parcelas campesinas: huerto, frutales, animales menores y bosque en una misma unidad.","Cafetales diversificados con árboles nativos, frutales y alimentos.","Turismo regenerativo y educación como ingreso complementario.","Pago por servicios ambientales por la conservación del bosque de niebla."],"cultivos":["Café bajo sombra","Maíz y frijol","Hortalizas y tubérculos","Frutales","Hongos","Bambú","Ganado de leche y aves de corral"],"fauna":["Tucaneta verde (Aulacorhynchus prasinus)","Chachalaca (Ortalis vetula)","Colibríes","Aves migratorias de Norteamérica que invernan en el cafetal","Ardilla gris (Sciurus aureogaster)","Tlacuache (Didelphis sp.)","Abejas nativas sin aguijón"],"especies":["Liquidámbar (Liquidambar styraciflua)","Encinos y robles (Quercus spp.)","Helechos arborescentes","Bromelias, orquídeas y musgos epífitos","Chalahuite (Inga spp.)"],"identidad":["El roble que le da nombre a la finca es un encino: en el bosque de niebla de Huatusco, robles y encinos (Quercus) comparten el dosel con el liquidámbar.","Huatusco viene del náhuatl Cuauhtochco; es una de las regiones cafetaleras históricas de Veracruz, dentro de la Denominación de Origen «Café Veracruz».","El bosque de niebla vive de la neblina casi diaria que sube del Golfo: guarda helechos arborescentes, orquídeas, bromelias y aves que no viven en otros bosques."],"alt":1342,"km":2.9,"llegada":"07:40","salida":"09:40","clima":{"formula":"C(w2)b(i')","rasgos":["Templado subhúmedo, el más húmedo de los subhúmedos, con lluvias en verano","lluvia invernal entre 5 y 10.2 % del total anual","verano fresco y largo (mes más cálido entre 6.5 y 22 °C)","con poca oscilación térmica (entre 5 y 7 °C)"],"descripcion":"Templado subhúmedo, el más húmedo de los subhúmedos, con lluvias en verano. La temperatura media anual es de 17.1 °C: el mes más fresco es enero (13.5 °C) y el más cálido junio (19.6 °C). Llueven 2,005 mm al año, 83 % de ellos entre mayo y octubre; ningún mes es seco: la neblina y las lloviznas de invierno mantienen la humedad.","t":[13.5,14.5,16.3,18.3,19.5,19.6,18.7,18.9,18.8,17.5,15.6,14.3],"tmax":[19.2,20.8,22.8,25.1,25.7,25.1,24.5,24.7,23.9,22.8,20.9,20.0],"tmin":[7.8,8.3,9.9,11.6,13.3,14.1,12.9,13.1,13.7,12.2,10.3,8.6],"p":[50.5,38.1,56.3,67.8,145.5,331.2,324.2,329.4,344.8,188.1,80.2,49.3],"ta":17.1,"P":2005,"estacion":"Centro Regional Huatusco, clave 30342, Huatusco","periodo":"1991-2020","dist":4.1,"fuente_t":"medida en la misma estación"},"num":1},{"id":"chayote","tipo":"visita","nombre":"Banco Nacional de Germoplasma de Chayote (BANGESe)","corto":"Banco de chayote","lugar":"CARSH, Universidad Autónoma Chapingo","lat":19.17437,"lon":-96.96141,"estancia":100,"actividad":"Recorrido por el banco de germoplasma de Sechium edule: la diversidad del chayote, su conservación y su mejoramiento.","expone":"M.C. Víctor Manuel Cisneros Solano (Universidad Autónoma Chapingo)","estacion":"30342","etiquetas":["Recursos fitogenéticos","Chayote","Conservación"],"paisaje":"Parcelas experimentales con emparrados de chayote dentro del campus universitario.","relieve":"Lomas de la meseta de Huatusco, sobre materiales volcánicos.","suelo":"Andosoles profundos con buen drenaje, que el chayote necesita para no pudrir sus raíces.","sistema":"Colección viva de chayotes cultivados y silvestres en emparrado, para conservar su diversidad genética.","ciencia":["El Banco Nacional de Germoplasma de Sechium edule (BANGESe) se fundó en 2005 en Huatusco para conservar las especies endémicas y las variantes biológicas del chayote; reúne colectas de 12 estados del país.","México es centro de origen, domesticación y diversificación del chayote; su mayor plasticidad se observa en Veracruz.","Hay complejos varietales como virens levis, nigrum spinosum, nigrum xalapensis, albus dulcis y albus minor, pero en el comercio solo se usa virens levis: verde claro, sin espinas y en forma de pera.","Las variedades mejoradas desplazan a las poblaciones semidomesticadas: por eso el banco es clave contra la erosión genética."],"elementos":["Diversidad","Creación conjunta de conocimientos","Resiliencia","Cultura y tradiciones alimentarias"],"analisis":"Si en el mercado solo se vende un tipo de chayote, ¿por qué conservar decenas de tipos distintos?","observar":["Formas, colores y espinas de los distintos chayotes de la colección.","Cómo se construye el emparrado y por qué.","Flores masculinas y femeninas, y los polinizadores que las visitan.","Cómo se registra cada accesión (datos de pasaporte) y cómo se renueva.","Otros usos de la planta: guías tiernas, raíz (chinchayote) y hojas."],"alternativas":["Ferias y bancos comunitarios de semillas de chayote criollo.","Mercados para chayotes distintos al verde liso: blancos, oscuros, espinosos.","Polinizadores nativos y manejo agroecológico de plagas en el emparrado."],"cultivos":["Chayote (Sechium edule)","Especies silvestres emparentadas (S. compositum, S. chinantlense)"],"fauna":["Abejas (Apis mellifera) y abejas nativas","Avispas y otros polinizadores","Ardilla gris","Aves del campus"],"especies":["Chalahuite (Inga spp.)","Liquidámbar","Árboles del campus y relictos de bosque mesófilo"],"identidad":["La palabra chayote viene del náhuatl huitz ayotl, «calabaza espinosa».","En la cocina veracruzana el chayote se come en caldos, guisos, rellenos y en dulce; también sus guías tiernas y la raíz, el chinchayote.","El banco es parte del Grupo Interdisciplinario de Investigación en Sechium edule en México (GISeM) y del Centro Regional Universitario Oriente de la Universidad Autónoma Chapingo."],"alt":1341,"km":4.9,"llegada":"09:45","salida":"11:25","clima":{"formula":"C(w2)b(i')","rasgos":["Templado subhúmedo, el más húmedo de los subhúmedos, con lluvias en verano","lluvia invernal entre 5 y 10.2 % del total anual","verano fresco y largo (mes más cálido entre 6.5 y 22 °C)","con poca oscilación térmica (entre 5 y 7 °C)"],"descripcion":"Templado subhúmedo, el más húmedo de los subhúmedos, con lluvias en verano. La temperatura media anual es de 17.1 °C: el mes más fresco es enero (13.5 °C) y el ión.","sistema":"Finca cafetalera familiar con sistemas de producción de café y cultivos asociados bajo un manejo sostenible: el cafetal bajo sombra comparte la parcela con otros cultivos que diversifican el ingreso, y el beneficio lleva el grano del despulpado, la fermentación, el lavado y el secado hasta el café pergamino y la taza.","ciencia":["El beneficio húmedo separa la pulpa y el mucílago; el natural seca la cereza entera; el honey deja parte del mucílago. Cada proceso cambia el sabor en taza.","La altitud alarga la maduración del grano y da cafés más ácidos y aromáticos: por eso el café «de altura» se paga mejor."],"elementos":["Diversidad","Sinergias","Resiliencia","Economía circular y solidaria","Cultura y tradiciones alimentarias","Reciclaje"],"analisis":"¿Cómo combina una finca familiar el café con otros cultivos para producir de forma sostenible? ¿Y qué hace falta para que el valor de una taza de café de especialidad se quede en la finca y en la comunidad?","observar":["Qué cultivos se asocian al café y qué aporta cada uno (sombra, alimento, ingreso, suelo).","Qué aprendió en la Orientación en Cafeticultura de Chapingo que hoy aplica en su finca.","Proceso de beneficio: equipo, uso de agua y tiempos.","Qué se hace con la pulpa y las aguas mieles del beneficio.","Secado: patios, camas africanas o secadoras.","Cómo se mide la calidad: catación, puntaje y defectos.","A quién se vende: intermediario, cooperativa, tostador o venta directa."],"alternativas":["Tratamiento de aguas mieles y compostaje de la pulpa.","Beneficios ecológicos de bajo consumo de agua.","Marca propia, turismo del café y venta directa.","Organización de productores para comprar y vender juntos."],"cultivos":["Café arábigo","Plátano","Maíz","Frutales"],"fauna":["Tucaneta verde (Aulacorhynchus prasinus)","Chachalaca (Ortalis vetula)","Colibríes","Aves migratorias de Norteamérica que invernan en el cafetal","Ardilla gris (Sciurus aureogaster)","Tlacuache (Didelphis sp.)","Abejas nativas o, rábano, chile habanero, cúrcuma, jengibre y germinados de lenteja.","Hierbas de la cocina y la medicina tradicional mexicana: epazote, estafiate, muicle (sangre de Cristo), ruda, romero, té limón, tlanepa u hoja santa, cilantro cimarrón y cebollín xonacate, además de hoja de guayabo, níspero y guanábano.","Conservas y fermentos: kombucha de jengibre, tamarindo o jamaica; ginger beer; chucrut dorado (cúrcuma y tomillo), morado y blanco (jengibre); curcumiel; pesto, chimichurri, salsa macha de chile comanero con arándanos, mermeladas, mostaza con vinagre de kombucha y escabeches.","De la colmena: miel multiflora de la Sierra de Zongolica, y polen y propóleo de abejas meliponinas, las abejas sin aguijón nativas de México.","También infusiones funcionales de hierbas deshidratadas, cosmética natural con caléndula, vainilla y café agroecológico de la Finca Coralillo. Sus recipientes son retornables."],"elementos":["Diversidad","Economía circular y solidaria","Reciclaje","Cultura y tradiciones alimentarias","Creación conjunta de conocimientos","Valores humanos y sociales"],"analisis":"¿Cómo convierte una empresa familiar un huerto pequeño en un negocio que vive de agregar valor (fermentar, conservar, secar) y de vender directo, sin intermediarios?","observar":["Cuántas especies hay en el huerto y cómo se acomodan en poco espacio.","Cómo se fertiliza y se protege el huerto sin agroquímicos de síntesis.","Procesos de transformación: fermentación de kombucha y chucrut, secado de hierbas, elaboración de conservas.","Las cajas de abejas sin aguijón (meliponas) y cómo se manejan.","Cómo funciona el sistema de envases retornables y la venta directa (redes sociales, pedidos).","Qué aprendió en la Licenciatura en Redes Agroalimentarias que hoy aplica en la empresa."],"alternativas":["Encadenar a productores de la región como proveedores (como la miel de Zongolica o el café de Finca Coralillo).","Recuperar y valorar las plantas medicinales y condimentos tradicionales.","Meliponic       else if (bl.campos) cuerpo += bl.campos.map(([e, v]) => parrafo(run(e + ": ", { b: true }) + run(v || "______________________________"))).join("");
      else if (bl.img) {
        const k = imagenes.length + 1, id = `rIdImg${k}`;
        imagenes.push({ id, nombre: `img${k}.${bl.ext || "jpeg"}`, datos: bl.img });
        const maxCm = bl.cm || 15, ratio = bl.alto / bl.ancho;
        const cx = Math.round(maxCm * 360000), cy = Math.round(maxCm * ratio * 360000);
        cuerpo += `<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${k}" name="Imagen ${k}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${k}" name="img${k}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${id}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
      } else if (bl.p != null) cuerpo += parrafo(run(bl.p, { b: bl.b }), { jc: bl.jc || "both" });
    }
    const documento = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>${cuerpo}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="${opc.margen || 1418}" w:right="${opc.margen || 1418}" w:bottom="${opc.margen || 1418}" w:left="${opc.margen ? opc.margen + 140 : 1701}" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>`;
    const estilo = (id, nombre, rpr, ppr = "") => `<w:style w:type="paragraph" w:styleId="${id}"><w:name w:val="${nombre}"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr>${ppr}</w:pPr><w:rPr>${rpr}</w:rPr></w:style>`;
    const estilos = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="${FUENTE}" w:hAnsi="${FUENTE}" w:cs="${FUENTE}" w:eastAsia="${FUENTE}"/><w:sz w:val="${tamBase}"/><w:lang w:val="es-MX"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="${despuesBase}" w:line="${interlineado}" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>`
      + estilo("Titulo", "Title", '<w:b/><w:color w:val="1F3B2D"/><w:sz w:val="40"/>', '<w:spacing w:after="240"/>')
      + estilo("Ttulo1", "heading 1", '<w:b/><w:color w:val="1F3B2D"/><w:sz w:val="32"/>', '<w:keepNext/><w:spacing w:before="360" w:after="160"/><w:outlineLvl w:val="0"/>')
      + estilo("Ttulo2", "heading 2", '<w:b/><w:color w:val="8A5A1F"/><w:sz w:val="27"/>', '<w:keepNext/><w:spacing w:before="280" w:after="120"/><w:outlineLvl w:val="1"/>')
      + estilo("Ttulo3", "heading 3", '<w:b/><w:i/><w:color w:val="1F3B2D"/><w:sz w:val="24"/>', '<w:keepNext/><w:spacing w:before="200" w:after="80"/><w:outlineLvl w:val="2"/>')
      + estilo("Lista", "List Paragraph", "", '<w:ind w:left="360"/><w:spacing w:after="60"/>')
      + "</w:styles>";
    const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdEstilos" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${imagenes.map((im) => `<Relationship Id="${im.id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${im.nombre}"/>`).join("")}</Relationships>`;
    const tipos = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
    const raiz = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
    return zip([
      { nombre: "[Content_Types].xml", datos: tipos }, { nombre: "_rels/.rels", datos: raiz },
      { nombre: "word/document.xml", datos: documento }, { nombre: "word/styles.xml", datos: estilos },
      { nombre: "word/_rels/document.xml.rels", datos: rels },
      ...imagenes.map((im) => ({ nombre: "word/media/" + im.nombre, datos: im.datos })),
    ]);
  }

  // Lee el texto de un .docx (para importar notas). Usa la descompresión del propio navegador.
  async function leerTexto(archivo) {
    const buf = new Uint8Array(await archivo.arrayBuffer()), dv = new DataView(buf.buffer);
    let fin = -1;
    for (let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { fin = i; break; }
    if (fin < 0) throw new Error("El archivo no parece un documento de Word (.docx).");
    let p = dv.getUint32(fin + 16, true);
    const total = dv.getUint16(fin + 10, true);
    for (let k = 0; k < total; k++) {
      const metodo = dv.getUint16(p + 10, true), tam = dv.getUint32(p + 20, true);
      const ln = dv.getUint16(p + 28, true), le = dv.getUint16(p + 30, true), lc = dv.getUint16(p + 32, true);
      const local = dv.getUint32(p + 42, true);
      const nombre = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + ln));
      if (nombre === "word/document.xml") {
        const inicio = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
        let datos = buf.subarray(inicio, inicio + tam);
        if (metodo === 8) {
          if (typeof DecompressionStream === "undefined") throw new Error("Este navegador no puede leer archivos de Word. Copia y pega el texto.");
          datos = new Uint8Array(await new Response(new Blob([datos]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
        }
        const xml = new DOMParser().parseFromString(new TextDecoder().decode(datos), "application/xml");
        const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
        return [...xml.getElementsByTagNameNS(W, "p")].map((par) => {
          let t = "";
          par.querySelectorAll("*").forEach((n) => {
            if (n.namespaceURI !== W) return;
            if (n.localName === "t") t += n.textContent;
            else if (n.localName === "tab") t += "\t";
            else if (n.localName === "br") t += "\n";
          });
          return t;
        }).join("\n").replace(/\n{3,}/g, "\n\n").trim();
      }
      p += 46 + ln + le + lc;
    }
    throw new Error("No se encontró el texto dentro del archivo de Word.");
  }

  return { crear, leerTexto, zip };
})();

// Mapa 3D del viaje (three.js r128): relieve, rutas por día y sitios. Funciona sin internet.
// crearMapa3D(contenedor, {malla, rutas:[{dia, color, puntos:[[lat,lon]...]}], sitios:[{id, dia, etiqueta, lat, lon}], alIr, cielo})
function crearMapa3D(cont, cfg) {
  const { malla } = cfg;
  const [LO0, LO1, LA0, LA1] = malla.bbox;
  const NX = malla.nx, NY = malla.ny, EL = malla.elev;
  const KMX = (LO1 - LO0) * 111.32 * Math.cos(((LA0 + LA1) / 2) * Math.PI / 180);
  const KMY = (LA1 - LA0) * 110.57;
  const EXAG = cfg.exag || 7, ESC = cfg.escala || 1, TAM = Math.max(KMX, KMY);
  const Y = (e) => (Math.max(e, 0) / 1000) * EXAG;
  const aXZ = (lat, lon) => [(lon - LO0) / (LO1 - LO0) * KMX - KMX / 2, (LA1 - lat) / (LA1 - LA0) * KMY - KMY / 2];
  function altura(lat, lon) {
    const fx = (lon - LO0) / (LO1 - LO0) * (NX - 1), fy = (LA1 - lat) / (LA1 - LA0) * (NY - 1);
    const i = Math.max(0, Math.min(NX - 2, Math.floor(fx))), j = Math.max(0, Math.min(NY - 2, Math.floor(fy)));
    const tx = fx - i, ty = fy - j, e = (a, b) => EL[b * NX + a];
    return (e(i, j) * (1 - tx) + e(i + 1, j) * tx) * (1 - ty) + (e(i, j + 1) * (1 - tx) + e(i + 1, j + 1) * tx) * ty;
  }

  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
  catch (e) { cont.innerHTML = '<p class="sin-3d">Este teléfono no puede mostrar el mapa en 3D. Usa el mapa plano.</p>'; return null; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  cont.appendChild(renderer.domElement);
  const escena = new THREE.Scene();
  escena.background = new THREE.Color(cfg.cielo || 0xe6ece4);
  escena.fog = new THREE.Fog(escena.background, TAM * 1.4, TAM * 3.6);
  const camara = new THREE.PerspectiveCamera(38, 1, 0.2 * ESC, TAM * 8);

  // terreno con colores hipsométricos (mar en azul)
  const geo = new THREE.PlaneGeometry(KMX, KMY, NX - 1, NY - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, col = [];
  const rampa = cfg.rampa || [[0, [178, 205, 214]], [5, [196, 206, 160]], [300, [170, 194, 120]], [900, [120, 166, 96]], [1600, [150, 160, 98]],
                 [2300, [186, 170, 120]], [2900, [120, 138, 92]], [3600, [92, 112, 80]], [4300, [160, 150, 140]], [5000, [245, 245, 245]]];
  function color(e) {
    for (let k = 0; k < rampa.length - 1; k++) {
      const [e0, c0] = rampa[k], [e1, c1] = rampa[k + 1];
      if (e <= e1) { const t = Math.max(0, (e - e0) / (e1 - e0)); return c0.map((v, q) => (v + (c1[q] - v) * t) / 255); }
    }
    return [1, 1, 1];
  }
  for (let k = 0; k < pos.count; k++) { pos.setY(k, Y(EL[k])); col.push(...color(EL[k])); }
  geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  escena.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true })));
  const base = new THREE.Mesh(new THREE.BoxGeometry(KMX, 3 * ESC, KMY), new THREE.MeshLambertMaterial({ color: cfg.colorBase || 0x8a7458 }));
  base.position.y = -1.5 * ESC;
  escena.add(base);
  escena.add(new THREE.HemisphereLight(0xffffff, 0x6b5a40, 0.75));
  const sol = new THREE.DirectionalLight(0xffffff, 0.8);
  sol.position.set(-TAM * 0.5, TAM * 0.65, -TAM * 0.3);
  escena.add(sol);

  // rutas (un tubo por día)
  const tubos = {}, curvas = {};
  cfg.rutas.forEach((r) => {
    const v = r.puntos.map(([la, lo]) => { const [x, z] = aXZ(la, lo); return new THREE.Vector3(x, Y(altura(la, lo)) + 0.6 * ESC, z); });
    const curva = new THREE.CatmullRomCurve3(v, false, "centripetal");
    curvas[r.dia] = curva;
    const m = new THREE.MeshBasicMaterial({ color: r.color, transparent: true, opacity: 1 });
    const t = new THREE.Mesh(new THREE.TubeGeometry(curva, Math.min(v.length * 2, 2400), cfg.grosor || 0.75 * ESC, 6, false), m);
    escena.add(t);
    tubos[r.dia] = t;
  });

  // sitios
  const capa = document.createElement("div");
  capa.className = "capa-etiquetas";
  cont.appendChild(capa);
  const pines = cfg.sitios.map((s) => {
    const [x, z] = aXZ(s.lat, s.lon), y = Y(altura(s.lat, s.lon));
    const h = 7 * ESC;
    const palo = new THREE.Mesh(new THREE.CylinderGeometry(0.25 * ESC, 0.25 * ESC, h, 6), new THREE.MeshBasicMaterial({ color: 0x1f2a24 }));
    palo.position.set(x, y + h / 2, z);
    const cabeza = new THREE.Mesh(new THREE.SphereGeometry(1.3 * ESC, 12, 10), new THREE.MeshBasicMaterial({ color: s.color || 0x1f2a24 }));
    cabeza.position.set(x, y + h, z);
    escena.add(palo, cabeza);
    const et = document.createElement("button");
    et.type = "button";
    et.className = "etiqueta-3d";
    et.innerHTML = `<i style="background:${s.colorCss || "#1f2a24"}">${s.num != null ? s.num : s.dia}</i><span>${s.etiqueta}</span>`;
    et.setAttribute("aria-label", s.etiqueta);
    if (cfg.alIr) et.addEventListener("click", () => cfg.alIr(s));
    capa.appendChild(et);
    return { s, vec: new THREE.Vector3(x, y + h, z), et, palo, cabeza };
  });

  const CENTRO = new THREE.Vector3(0, 0, 0);
  function vistaGeneral() {
    const r = cont.clientWidth / Math.max(1, cont.clientHeight);
    if (cfg.vista) return cfg.vista(r, THREE);
    if (r < 1.1) return { pos: new THREE.Vector3(KMX * 0.95, 330, 70), obj: new THREE.Vector3(-25, 0, 5) };
    return { pos: new THREE.Vector3(-20, 250, 255), obj: CENTRO.clone() };
  }
  const v0 = vistaGeneral();
  camara.position.copy(v0.pos);
  let controles = null;
  if (THREE.OrbitControls) {
    controles = new THREE.OrbitControls(camara, renderer.domElement);
    controles.target.copy(v0.obj);
    controles.enableDamping = true;
    controles.dampingFactor = 0.08;
    controles.maxPolarAngle = Math.PI * 0.47;
    controles.minDistance = 15 * ESC;
    controles.maxDistance = TAM * 2.2;
    controles.update();
  } else camara.lookAt(v0.obj);

  function tamano() {
    const w = cont.clientWidth, h = cont.clientHeight;
    renderer.setSize(w, h, false);
    camara.aspect = w / h;
    camara.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(tamano).observe(cont); else window.addEventListener("resize", tamano);
  tamano();

  let diaActivo = null;
  const v = new THREE.Vector3();
  function etiquetas() {
    const w = cont.clientWidth, h = cont.clientHeight;
    const usadas = [];
    pines.forEach(({ s, vec, et }) => {
      if (diaActivo !== null && s.dia !== diaActivo) { et.hidden = true; return; }
      v.copy(vec).project(camara);
      let fuera = v.z > 1 || v.x < -1.05 || v.x > 1.05 || v.y < -1.05 || v.y > 1.05;
      const px = (v.x + 1) / 2 * w, py = (1 - v.y) / 2 * h;
      // en la vista de todo el viaje se ocultan etiquetas que se enciman
      if (!fuera && diaActivo === null && usadas.some(([a, b]) => Math.abs(a - px) < 70 && Math.abs(b - py) < 22)) fuera = true;
      et.hidden = fuera;
      if (!fuera) { usadas.push([px, py]); et.style.transform = `translate(${px}px, ${py}px) translate(-50%, -125%)`; }
    });
  }

  // posición del teléfono en vivo (GPS; no necesita internet)
  let yo = null, etYo = null, rastro = null, seguir = false, pulso = 0;
  const rastroPts = [];
  function ponerYo(lat, lon, opc = {}) {
    if (lon < LO0 || lon > LO1 || lat < LA0 || lat > LA1) return false;
    const [x, z] = aXZ(lat, lon), y = Y(altura(lat, lon));
    if (!yo) {
      const rojo = new THREE.MeshBasicMaterial({ color: 0xd63a2f });
      const haz = new THREE.Mesh(new THREE.CylinderGeometry(0.4 * ESC, 0.4 * ESC, 12 * ESC, 8), rojo);
      haz.position.y = 6 * ESC;
      const bola = new THREE.Mesh(new THREE.SphereGeometry(2.1 * ESC, 18, 14), rojo);
      bola.position.y = 12.5 * ESC;
      const anillo = new THREE.Mesh(new THREE.RingGeometry(2.4 * ESC, 3.4 * ESC, 40),
        new THREE.MeshBasicMaterial({ color: 0xd63a2f, transparent: true, opacity: 0.7, side: THREE.DoubleSide }));
      anillo.rotation.x = -Math.PI / 2;
      anillo.position.y = 0.9 * ESC;
      yo = new THREE.Group();
      yo.add(haz, bola, anillo);
      yo.userData.anillo = anillo;
      escena.add(yo);
      etYo = document.createElement("div");
      etYo.className = "etiqueta-3d etiqueta-yo";
      etYo.innerHTML = "<i>●</i><span>Tú</span>";
      capa.appendChild(etYo);
    }
    yo.visible = true;
    etYo.hidden = false;
    yo.position.set(x, y, z);
    const p = new THREE.Vector3(x, y + 0.9 * ESC, z);
    if (!rastroPts.length || rastroPts[rastroPts.length - 1].distanceTo(p) > 0.15 * ESC) rastroPts.push(p);
    if (rastroPts.length > 1) {
      if (rastro) { escena.remove(rastro); rastro.geometry.dispose(); }
      rastro = new THREE.Line(new THREE.BufferGeometry().setFromPoints(rastroPts), new THREE.LineBasicMaterial({ color: 0xd63a2f }));
      escena.add(rastro);
    }
    seguir = !!opc.seguir;
    if (seguir) {
      const obj = controles ? controles.target : CENTRO;
      const off = camara.position.clone().sub(obj);
      if (opc.acercar || off.length() > 160 * ESC) off.setLength((opc.acercar ? 70 : 160) * ESC);
      volar(new THREE.Vector3(x, y, z).add(off), new THREE.Vector3(x, y, z));
    }
    return true;
  }
  function quitarYo() {
    seguir = false;
    if (yo) yo.visible = false;
    if (etYo) etYo.hidden = true;
  }

  // paseo virtual: un autobús recorre la ruta y la cámara lo sigue
  let paseo = null, bus = null;
  function crearBus() {
    bus = new THREE.Group();
    const cuerpo = new THREE.Mesh(new THREE.BoxGeometry(2.6 * ESC, 1.5 * ESC, 1.2 * ESC), new THREE.MeshLambertMaterial({ color: cfg.colorBus || 0xf2c14e }));
    cuerpo.position.y = 1.1 * ESC;
    const techo = new THREE.Mesh(new THREE.BoxGeometry(2.7 * ESC, 0.25 * ESC, 1.3 * ESC), new THREE.MeshLambertMaterial({ color: 0xffffff }));
    techo.position.y = 1.95 * ESC;
    const halo = new THREE.Mesh(new THREE.SphereGeometry(2.4 * ESC, 16, 12), new THREE.MeshBasicMaterial({ color: cfg.colorBus || 0xf2c14e, transparent: true, opacity: 0.25 }));
    halo.position.y = 1.2 * ESC;
    bus.add(cuerpo, techo, halo);
    escena.add(bus);
  }
  function recorrer(dia, opc = {}) {
    const curva = curvas[dia];
    if (!curva) return null;
    if (!bus) crearBus();
    bus.visible = true;
    paseo = { curva, t: opc.desde || 0, dur: opc.duracion || 60, pausa: false, alAvanzar: opc.alAvanzar, alTerminar: opc.alTerminar, prev: performance.now() };
    return {
      pausar() { if (paseo) paseo.pausa = true; },
      seguir() { if (paseo) { paseo.pausa = false; paseo.prev = performance.now(); } },
      ir(t) { if (paseo) paseo.t = Math.max(0, Math.min(1, t)); },
      detener() { paseo = null; if (bus) bus.visible = false; },
      get t() { return paseo ? paseo.t : 0; },
      get pausado() { return !paseo || paseo.pausa; },
    };
  }
  function pasoPaseo() {
    if (!paseo) return;
    const ahora = performance.now();
    if (!paseo.pausa) paseo.t = Math.min(1, paseo.t + (ahora - paseo.prev) / 1000 / paseo.dur);
    paseo.prev = ahora;
    const p = paseo.curva.getPointAt(paseo.t), q = paseo.curva.getPointAt(Math.min(1, paseo.t + 0.004));
    bus.position.copy(p);
    bus.lookAt(q.x, p.y, q.z);
    bus.rotateY(-Math.PI / 2);
    const dir = q.clone().sub(p).setY(0).normalize();
    const objetivo = p.clone();
    const posCam = p.clone().add(dir.multiplyScalar(-26 * ESC)).add(new THREE.Vector3(0, 18 * ESC, 0));
    camara.position.lerp(posCam, 0.06);
    if (controles) controles.target.lerp(objetivo, 0.12); else camara.lookAt(objetivo);
    if (paseo.alAvanzar) paseo.alAvanzar(paseo.t);
    if (paseo.t >= 1 && !paseo.pausa) { paseo.pausa = true; if (paseo.alTerminar) paseo.alTerminar(); }
  }

  let anim = null;
  function volar(p1, o1) {
    anim = { t: 0, p0: camara.position.clone(), o0: (controles ? controles.target : CENTRO).clone(), p1, o1 };
  }
  const reducir = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function cuadro() {
    if (anim) {
      anim.t = reducir ? 1 : Math.min(1, anim.t + 0.025);
      const k = anim.t < 0.5 ? 2 * anim.t * anim.t : 1 - Math.pow(-2 * anim.t + 2, 2) / 2;
      camara.position.lerpVectors(anim.p0, anim.p1, k);
      const o = new THREE.Vector3().lerpVectors(anim.o0, anim.o1, k);
      if (controles) controles.target.copy(o); else camara.lookAt(o);
      if (anim.t >= 1) anim = null;
    }
    if (controles) controles.update();
    pasoPaseo();
    if (yo && yo.visible) {

// paseo virtual con reloj: relaciona el avance con la hora y el kilómetro estimados
const KM_RUTA = (() => { let k = 0; return D.ruta.map((p, i) => (i ? (k += distKm(D.ruta[i - 1], p)) : 0)); })();
function horaEn(km) {
  for (const t of D.tramos) {
    const p0 = D.paradas.find((x) => x.id === t.desde), p1 = D.paradas.find((x) => x.id === t.hasta);
    if (km <= p1.km + 0.01) {
      const f = Math.max(0, Math.min(1, (km - p0.km) / Math.max(0.1, p1.km - p0.km)));
      return { hora: minutos(t.salida) + f * t.min, tramo: `rumbo a ${p1.corto}` };
    }
  }
  return { hora: minutos(D.paradas[D.paradas.length - 1].llegada), tramo: "llegada a Huatusco" };
}
function alternarPaseo() {
  if (!mapa3d) return;
  const btn = $("#paseo-btn");
  if (paseo && !paseo.pausado) { paseo.pausar(); btn.textContent = "▶ Continuar"; return; }
  if (paseo) { paseo.seguir(); btn.textContent = "❚❚ Pausa"; return; }
  if (gps.id != null) detenerGPS();
  $("#hud").hidden = false;
  paseo = mapa3d.recorrer(0, {
    duracion: 75,
    alAvanzar: (t) => {
      const km = t * D.km_total, h = horaEn(km);
      const i = Math.min(D.ruta.length - 1, KM_RUTA.findIndex((k) => k >= km * (KM_RUTA[KM_RUTA.length - 1] / D.km_total)));
      const p = D.ruta[i < 0 ? D.ruta.length - 1 : i];
      $("#hud-hora").textContent = `${String(Math.floor(h.hora / 60)).padStart(2, "0")}:${String(Math.round(h.hora % 60) % 60).padStart(2, "0")}`;
      $("#hud-tramo").textContent = h.tramo;
      $("#hud-km").textContent = `km ${fmt(Math.round(km))} de ${fmt(Math.round(D.km_total))}`;
      $("#hud-alt").textContent = `${fmt(alturaMalla(p[0], p[1]) || 0)} m`;
      $("#hud-barra").style.width = (t * 100).toFixed(1) + "%";
    },
    alTerminar: () => { $("#paseo-btn").textContent = "↺ Repetir"; paseo.detener(); paseo = null; },
  });
  btn.textContent = "❚❚ Pausa";
}
function detenerPaseo() { if (paseo) paseo.detener(); paseo = null; $("#hud").hidden = true; $("#paseo-btn").textContent = "▶ Recorrer la ruta"; }

// ------------------------------------------------------------------ ubicación en vivo (GPS sin internet)
const gps = { id: null, primera: true, wake: null };
async function mantenerPantalla() {
  try { if ("wakeLock" in navigator && gps.id != null && !gps.wake) { gps.wake = await navigator.wakeLock.request("screen"); gps.wake.addEventListener("release", () => (gps.wake = null)); } } catch (e) { /* opcional */ }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") mantenerPantalla(); });
function iniciarGPS() {
  const info = $("#gps-info"), btn = $("#gps-btn");
  if (!navigator.geolocation) return aviso("Este teléfono no permite obtener la ubicación.");
  if (paseo) detenerPaseo();
  info.hidden = false; info.innerHTML = "<b>Buscando satélites…</b><span>Si estás bajo techo, acércate a una ventana.</span>";
  btn.textContent = "■ Dejar de seguir"; btn.setAttribute("aria-pressed", "true"); gps.primera = true;
  gps.id = navigator.geolocation.watchPosition(enPosicion, (err) => {
    info.innerHTML = `<b>No se pudo obtener la ubicación</b><span>${err.code === 1 ? "Da permiso de ubicación a esta página." : "Sin señal de GPS por ahora; se sigue intentando."}</span>`;
    if (err.code === 1) detenerGPS(true);
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 60000 });
  mantenerPantalla();
}
function detenerGPS(dejar) {
  if (gps.id != null) navigator.geolocation.clearWatch(gps.id);
  gps.id = null;
  if (gps.wake) { gps.wake.release().catch(() => {}); gps.wake = null; }
  const btn = $("#gps-btn"); if (btn) { btn.textContent = "📍 Seguir mi ubicación en vivo"; btn.setAttribute("aria-pressed", "false"); }
  if (mapa3d) mapa3d.quitarYo();
  if (!dejar && $("#gps-info")) $("#gps-info").hidden = true;
}
function cercaDeRuta(la, lo, antesDe) {
  // la ida y el regreso comparten carreteras: si se da un sitio destino, se prefiere el tramo anterior a él
  const cand = D.ruta.map((q, i) => ({ d: distKm([la, lo], q), km: KM_RUTA[i] / KM_RUTA[KM_RUTA.length - 1] * D.km_total }));
  const dmin = Math.min(...cand.map((c) => c.d));
  const cerca = cand.filter((c) => c.d <= dmin + 0.4);
  const previos = antesDe != null ? cerca.filter((c) => c.km <= antesDe + 0.3) : [];
  return (previos.length ? previos : cerca).reduce((a, b) => (b.d < a.d ? b : a));
}
function enPosicion(pos) {
  const { latitude: la, longitude: lo, accuracy, altitude, speed } = pos.coords, info = $("#gps-info");
  if (!mapa3d || !mapa3d.dentro(la, lo)) {
    if (mapa3d) mapa3d.quitarYo();
    info.innerHTML = `<b>Estás fuera del área del mapa</b><span>${la.toFixed(5)}, ${lo.toFixed(5)}</span>`;
    return;
  }
  mapa3d.yo(la, lo, { seguir: true, acercar: gps.primera }); gps.primera = false;
  const r = cercaDeRuta(la, lo);
  const sig = SITIOS.filter((p) => p.km >= r.km - 0.3)[0] || SITIOS[SITIOS.length - 1];
  const dSig = distKm([la, lo], [sig.lat, sig.lon]);
  info.innerHTML = `${r.d < 1.5 ? `<b>Sobre la ruta · km ${fmt(Math.round(r.km))} de ${fmt(Math.round(D.km_total))}</b>` : `<b>A ${r.d.toFixed(1)} km de la ruta</b>`}
    <span class="num">Altitud ≈ ${fmt(altitude != null ? Math.round(altitude) : alturaMalla(la, lo))} m${speed != null && speed > 0.5 ? ` · ${fmt(Math.round(speed * 3.6))} km/h` : ""} · precisión ±${fmt(Math.round(accuracy))} m</span>
    <span>Próximo sitio: <a href="#sitios/${sig.id}">${esc(sig.corto)}</a>, a ${dSig < 10 ? dSig.toFixed(1) : fmt(Math.round(dSig))} km al ${cardinal(rumbo([la, lo], [sig.lat, sig.lon]))} en línea recta</span>`;
}
